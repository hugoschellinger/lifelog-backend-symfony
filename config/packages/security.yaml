security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            json_login:
                # api_login is a route we will create below
                check_path: api_login
            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            # configure the maximum login attempts
            login_throttling: null
                # max_attempts: 5          # per minute ...
                # interval: '1 seconds' # ... or in a custom period
            logout:
                path: api_logout

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/(%app.locales%)/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/user/verification, roles: PUBLIC_ACCESS }
        # - { path: ^/api/(%app.locales%)/test, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/home, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/resetPassword, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/version, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/checkEmail, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%)/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/(%app.locales%), roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
